name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            bundle: EchoYT-linux-x86_64.tar.gz
          - os: windows-latest
            artifact: windows-x86_64
            bundle: EchoYT-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 mpv

      - name: Download libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python packaging/get_libmpv.py .

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean echoyt.spec

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "${{ matrix.bundle }}" EchoYT

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/EchoYT/* -DestinationPath "${{ matrix.bundle }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoYT-${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EchoYT-linux-x86_64.tar.gz
            dist/EchoYT-windows-x86_64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
